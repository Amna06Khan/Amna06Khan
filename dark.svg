<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Color Gradients -->
    <linearGradient id="aciiGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1">
        <animate attributeName="offset" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1">
        <animate attributeName="offset" values="50%;150%;50%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1">
        <animate attributeName="offset" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#7C3AED;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
    </filter>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>

    <filter id="scanlines" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" />
    </filter>

    <!-- Noise Texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" />
      <feColorMatrix type="saturate" values="0.3" />
    </filter>

    <!-- Glass Effect -->
    <filter id="glassEffect">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.9" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="#030712" />

  <!-- Floating Glow Orbs -->
  <circle cx="200" cy="100" r="150" fill="url(#glowDark)" opacity="0.4">
    <animate attributeName="cx" values="200;250;200" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;150;100" dur="20s" repeatCount="indefinite" />
  </circle>

  <circle cx="950" cy="400" r="180" fill="url(#glowDark)" opacity="0.3">
    <animate attributeName="cx" values="950;900;950" dur="18s" repeatCount="indefinite" />
    <animate attributeName="cy" values="400;350;400" dur="22s" repeatCount="indefinite" />
  </circle>

  <!-- Noise Overlay -->
  <rect width="1180" height="610" fill="#030712" opacity="0.05" filter="url(#noise)" />

  <!-- Main Container Group -->
  <g>
    <!-- LEFT SIDE: ASCII Art -->
    <g>
      <!-- ASCII Container Background -->
      <rect x="30" y="50" width="380" height="520" rx="16" fill="#0F172A" opacity="0.4" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glassEffect)" />

      <!-- Floating ASCII -->
      <g filter="url(#scanlines)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="6s" repeatCount="indefinite" />

        <!-- ASCII Art Lines with Gradient -->
        <text x="60" y="100" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[    ████████   ]]>
          <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" />
        </text>

        <text x="60" y="115" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[   ██    ██   ]]>
          <animate attributeName="opacity" values="0;0;1;1" dur="4s" repeatCount="indefinite" />
        </text>

        <text x="60" y="130" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[  ██      ██  ]]>
          <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite" />
        </text>

        <text x="60" y="145" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[  ██      ██  ]]>
          <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite" />
        </text>

        <text x="60" y="160" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[   ██    ██   ]]>
          <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite" />
        </text>

        <text x="60" y="175" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="url(#aciiGradientDark)" opacity="0">
          <![CDATA[    ████████   ]]>
          <animate attributeName="opacity" values="0;0;0;1" dur="4s" repeatCount="indefinite" />
        </text>

        <!-- Blinking Cursor -->
        <rect x="60" y="190" width="8" height="15" fill="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" />
        </rect>

        <!-- Gradient Text Below ASCII -->
        <text x="60" y="240" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8">
          Developer &amp;
        </text>

        <text x="60" y="260" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8">
          Creative Coder
        </text>

        <!-- Scanline Effect -->
        <line x1="60" y1="280" x2="350" y2="280" stroke="#22D3EE" stroke-width="1" opacity="0.1">
          <animate attributeName="y1" values="280;520;280" dur="3s" repeatCount="indefinite" />
          <animate attributeName="y2" values="280;520;280" dur="3s" repeatCount="indefinite" />
        </line>
      </g>
    </g>

    <!-- RIGHT SIDE: Terminal Window -->
    <g>
      <!-- Terminal Background -->
      <rect x="440" y="50" width="710" height="520" rx="16" fill="#0F172A" opacity="0.5" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glassEffect)" />

      <!-- Terminal Header -->
      <rect x="440" y="50" width="710" height="40" rx="16" fill="rgba(31,41,55,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <!-- Terminal Buttons -->
      <circle cx="465" cy="70" r="4" fill="#EF4444" />
      <circle cx="485" cy="70" r="4" fill="#F59E0B" />
      <circle cx="505" cy="70" r="4" fill="#10B981" />

      <!-- Terminal Title -->
      <text x="550" y="75" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
        profile.terminal
      </text>

      <!-- Terminal Content Area -->
      <g clip-path="url(#terminalClip)">
        <!-- Greeting -->
        <text x="470" y="120" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC">
          Hi 👋
        </text>

        <text x="470" y="145" font-family="'Courier New', monospace" font-size="16" font-weight="bold">
          <tspan fill="url(#accentGradient)">I'm Developer</tspan>
        </text>

        <!-- Typing Animation for Roles -->
        <text x="470" y="180" font-family="'Courier New', monospace" font-size="13" fill="#22D3EE" opacity="0">
          <![CDATA[$ roles = []]>
          <animate attributeName="opacity" values="0;1;1;1;1;1" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Role 1 -->
        <text x="490" y="205" font-family="'Courier New', monospace" font-size="12" fill="#10B981" opacity="0">
          Frontend Engineer
          <animate attributeName="opacity" values="0;0;1;1;1;1" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Role 2 -->
        <text x="490" y="225" font-family="'Courier New', monospace" font-size="12" fill="#22D3EE" opacity="0">
          Full Stack Developer
          <animate attributeName="opacity" values="0;0;0;0.5;1;1" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Role 3 -->
        <text x="490" y="245" font-family="'Courier New', monospace" font-size="12" fill="#7C3AED" opacity="0">
          UI/UX Engineer
          <animate attributeName="opacity" values="0;0;0;0;0.5;1" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Info Section -->
        <line x1="470" y1="270" x2="1120" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

        <!-- Info Items - Sequential Reveal -->
        <text x="470" y="295" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          📍 Location:
        </text>
        <text x="600" y="295" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC" opacity="0">
          Earth 🌍
          <animate attributeName="opacity" values="0;0;0.5;1;1;1" dur="6s" repeatCount="indefinite" />
        </text>

        <text x="470" y="320" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          🎓 Education:
        </text>
        <text x="600" y="320" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC" opacity="0">
          CS &amp; Innovation
          <animate attributeName="opacity" values="0;0;0;0.5;1;1" dur="6s" repeatCount="indefinite" />
        </text>

        <text x="470" y="345" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          🎯 Focus:
        </text>
        <text x="600" y="345" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC" opacity="0">
          Building beautiful code
          <animate attributeName="opacity" values="0;0;0;0;0.5;1" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Skills Section Header -->
        <text x="470" y="380" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#22D3EE" opacity="0">
          💻 Tech Stack
          <animate attributeName="opacity" values="0;0;0;0;0;0.8" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Skill Pills -->
        <!-- React -->
        <rect x="470" y="395" width="70" height="28" rx="14" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="505" y="415" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" text-anchor="middle" opacity="0">
          React
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Node.js -->
        <rect x="560" y="395" width="70" height="28" rx="14" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="595" y="415" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" text-anchor="middle" opacity="0">
          Node.js
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- TypeScript -->
        <rect x="650" y="395" width="80" height="28" rx="14" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="690" y="415" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle" opacity="0">
          TypeScript
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Python -->
        <rect x="760" y="395" width="70" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="795" y="415" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle" opacity="0">
          Python
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Docker -->
        <rect x="850" y="395" width="70" height="28" rx="14" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="885" y="415" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" text-anchor="middle" opacity="0">
          Docker
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- AWS -->
        <rect x="940" y="395" width="60" height="28" rx="14" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.5)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="970" y="415" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle" opacity="0">
          AWS
          <animate attributeName="opacity" values="0;0;0;0;0.3;0.6" dur="6s" repeatCount="indefinite" />
        </text>

        <!-- Terminal Cursor -->
        <rect x="470" y="465" width="2" height="15" fill="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" />
        </rect>
        <text x="478" y="475" font-family="'Courier New', monospace" font-size="12" fill="#22D3EE">$</text>
      </g>

      <!-- Clipping Path for Terminal Content -->
      <clipPath id="terminalClip">
        <rect x="440" y="90" width="710" height="470" rx="16" />
      </clipPath>

      <!-- Social Icons at Bottom -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;0.7" dur="6s" repeatCount="indefinite" />

        <!-- GitHub -->
        <circle cx="480" cy="555" r="18" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1" />
        <text x="480" y="562" font-family="Arial" font-size="20" fill="#22D3EE" text-anchor="middle">⚙</text>

        <!-- LinkedIn -->
        <circle cx="540" cy="555" r="18" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1" />
        <text x="540" y="562" font-family="Arial" font-size="20" fill="#7C3AED" text-anchor="middle">💼</text>

        <!-- Twitter -->
        <circle cx="600" cy="555" r="18" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
        <text x="600" y="562" font-family="Arial" font-size="20" fill="#10B981" text-anchor="middle">🐦</text>

        <!-- Portfolio -->
        <circle cx="660" cy="555" r="18" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1" />
        <text x="660" y="562" font-family="Arial" font-size="20" fill="#22D3EE" text-anchor="middle">🔗</text>
      </g>
    </g>
  </g>

  <!-- Border Shimmer Animation -->
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" />
    <rect x="30" y="50" width="380" height="520" rx="16" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4" />
    <rect x="440" y="50" width="710" height="520" rx="16" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Floating Particles -->
  <g opacity="0.6">
    <!-- Particle 1 -->
    <circle cx="100" cy="100" r="2" fill="#22D3EE">
      <animate attributeName="cx" values="100;150;100" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;200;100" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 2 -->
    <circle cx="900" cy="500" r="1.5" fill="#7C3AED">
      <animate attributeName="cx" values="900;800;900" dur="15s" repeatCount="indefinite" />
      <animate attributeName="cy" values="500;400;500" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.6;0" dur="15s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 3 -->
    <circle cx="600" cy="150" r="1" fill="#10B981">
      <animate attributeName="cx" values="600;700;600" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="150;300;150" dur="22s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="20s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
